<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Acme Dental — AI Receptionist Demo</title>
<style>
  :root { color-scheme: light; }
  body { font-family: -apple-system, Segoe UI, Roboto, sans-serif; background: #f4f5f7; margin: 0; display: flex; justify-content: center; padding: 40px 16px; }
  .card { width: 100%; max-width: 480px; background: #fff; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.08); overflow: hidden; display: flex; flex-direction: column; height: 640px; }
  header { padding: 18px 20px; background: #1f2937; color: #fff; }
  header h1 { margin: 0; font-size: 16px; }
  header p { margin: 2px 0 0; font-size: 12px; color: #9ca3af; }
  #log { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 80%; padding: 10px 14px; border-radius: 14px; font-size: 14px; line-height: 1.4; white-space: pre-wrap; }
  .user { align-self: flex-end; background: #2563eb; color: #fff; border-bottom-right-radius: 4px; }
  .assistant { align-self: flex-start; background: #eef0f3; color: #111827; border-bottom-left-radius: 4px; }
  .escalated { align-self: center; background: #fef3c7; color: #92400e; font-size: 12px; padding: 6px 12px; border-radius: 10px; }
  form { display: flex; border-top: 1px solid #eee; padding: 10px; gap: 8px; }
  input { flex: 1; border: 1px solid #d1d5db; border-radius: 10px; padding: 10px 12px; font-size: 14px; }
  button { border: none; background: #2563eb; color: #fff; border-radius: 10px; padding: 0 16px; font-size: 14px; cursor: pointer; }
  button:disabled { opacity: 0.5; cursor: default; }
</style>
</head>
<body>
<div class="card">
  <header>
    <h1>Acme Dental — AI Receptionist</h1>
    <p>Demo agent · try "what are your hours" or "book a cleaning tomorrow"</p>
  </header>
  <div id="log"></div>
  <form id="form">
    <input id="input" autocomplete="off" placeholder="Type a message..." />
    <button id="send">Send</button>
  </form>
</div>

</html>
